[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autogen-cpas"
version = "0.1.0"
license = {file = "LICENSE-CODE"}
description = "CPAS utilities for AutoGen"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "autogen-core==0.6.1",
    "pydantic>=2,<3",
]

[project.scripts]
autogen-cpas-api = "autogen_cpas.api.tbeep_api:main"
autogen-cpas-gen-agents = "cpas_autogen.generate_agents:main"

[tool.hatch.build.targets.wheel]
packages = ["src/autogen_cpas"]

[tool.ruff]
extend = "../../pyproject.toml"
include = ["src/**", "tests/*.py"]

[tool.pyright]
extends = "../../pyproject.toml"
include = ["src", "tests"]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]

[tool.poe]
include = "../../shared_tasks.toml"

[tool.poe.tasks]
test = "pytest -n auto --cov=src --cov-report=term-missing --cov-report=xml"
